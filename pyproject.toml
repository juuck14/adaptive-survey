[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-survey"
version = "0.1.0"
description = "Reproducible adaptive stated-preference survey evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
neural = ["torch>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
adaptive-survey = "adaptive_survey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
